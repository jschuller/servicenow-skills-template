name: zizmor
# Security audit of the workflows and dependabot.yml (config: .github/zizmor.yml). The Action
# runs zizmor's container image by version and digest; results go to the log, not to code
# scanning, so it needs no security-events permission.
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.30.1"
          advanced-security: false
